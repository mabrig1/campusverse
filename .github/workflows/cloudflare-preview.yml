name: Cloudflare staging previews (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campusverse-cloudflare-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned application dependencies
        run: npm ci
      - name: Edge policy tests and config validation
        run: |
          node --test workers/edge-api/src/index.test.js
          node workers/edge-api/validate-config.mjs
      - name: Build staging frontend
        run: npm run build --workspace=frontend
      - name: Deploy preview API Worker to workers.dev only
        run: npx --yes wrangler@4.45.0 deploy --config workers/edge-api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging frontend assets to workers.dev only
        run: npx --yes wrangler@4.45.0 deploy --config frontend/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
