name: Laptop Exchange validation
on:
  push:
    branches:
      - feat/campusverse-laptop-exchange-20261112
      - feat/campusverse-owner-controlled-phones-laptops-20261113
  pull_request:
    paths:
      - 'backend/prisma/**'
      - 'backend/src/laptop-routes.js'
      - 'backend/src/laptop-ownership-*.js'
      - 'backend/server.js'
      - 'backend/src/device-offer-admin-routes.js'
      - 'backend/src/trading-owner.js'
      - 'backend/src/owner-managed-launch.js'
      - 'frontend/**'
      - '.github/workflows/laptop-exchange-ci.yml'
      - '.github/workflows/cloudflare-preview.yml'
      - 'workers/**'
      - 'docs/cloudflare-worker-rollout.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campusverse
          POSTGRES_PASSWORD: campusverse
          POSTGRES_DB: campusverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusverse -d campusverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://campusverse:campusverse@localhost:5432/campusverse?schema=public
      JWT_SECRET: laptop-ci-only-not-a-production-secret
      LAPTOP_PROOF_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned workspace dependencies
        run: npm ci
      - name: Prisma schema validation (no DB mutation)
        run: cd backend && npx prisma validate --schema prisma/schema.prisma
      - name: Apply migrations to disposable CI PostgreSQL
        run: cd backend && npx prisma migrate deploy && npx prisma generate
      - name: Backend syntax
        run: |
          node --check backend/server.js
          node --check backend/src/laptop-routes.js
          node --check backend/src/laptop-ownership-routes.js
          node --check backend/src/laptop-ownership-crypto.js
          node --check backend/src/device-offer-admin-routes.js
          node --check backend/src/trading-owner.js
          node --check backend/src/owner-managed-launch.js
      - name: Ownership encryption and serial fingerprint tests
        run: npm run test --workspace=backend
      - name: Cloudflare Worker safety and config tests
        run: |
          node --check workers/edge-api/src/index.js
          node --test workers/edge-api/src/index.test.js
          node --test workers/edge-api/prepare-staging.test.mjs
          node workers/edge-api/validate-config.mjs
      - name: Swap calculator unit tests
        run: npm run test --workspace=frontend
      - name: Frontend production build
        run: npm run build --workspace=frontend
      - name: Wrangler dry-run without Cloudflare credentials (staging only)
        run: |
          npx --yes wrangler@4.45.0 deploy --dry-run --config workers/edge-api/wrangler.jsonc
          npx --yes wrangler@4.45.0 deploy --dry-run --config frontend/wrangler.jsonc
